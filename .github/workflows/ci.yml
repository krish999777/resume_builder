name: CICD workflow
on:
    push:
        branches: [ main ]
        paths: [ 'backend/**' ]
    pull_request:
        branches: [main]
        paths: [ 'backend/**' ]

jobs:
    lint-and-format-check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: '24'

            - name: Install dependencies
              run: npm ci

            - name: Check formatting
              run: npm run format:check

            - name: Check lint
              run: npm run lint


